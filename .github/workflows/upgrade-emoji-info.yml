name: Upgrade Emoji Info

on:
  push:
    paths:
      - '.github/workflows/upgrade-emoji-info.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Info / Donations
        run: python .github/scripts/upgrade-emoji-info.py
      - name: Verify
        run: |
          grep -q 'payment-standard-v2' app/globals.css
          grep -q 'Donate with PayPal' app/page.tsx
          grep -q 'Donate with Stripe' app/page.tsx
          grep -q 'payment-availability' app/page.tsx
          ! grep -R -q 'apps-games-info-standard.js' app
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "Upgrade Emoji Info design"
          git push
